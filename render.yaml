databases:
  - name: cvmanagement-db
    plan: free
    databaseName: cvmanagement
    user: cvmanagement

services:
  - type: web
    name: cvmanagement
    plan: free
    runtime: docker
    repo: https://github.com/Samarth6840/Cvmanagement
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: CONNECTIONSTRINGS__DEFAULTCONNECTION
        fromDatabase:
          name: cvmanagement-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: production